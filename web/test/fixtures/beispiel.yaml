# ─────────────────────────────────────────────────────────────────────
#  weekleat – Rezeptkatalog
#
#  Hier stehen eure Lieblingsrezepte. Nach dem Speichern und Pushen ist die
#  Datei nach ca. 1 Minute in der App (einfach neu öffnen).
#
#  Felder pro Rezept:
#    titel:       Pflicht
#    portionen:   für wie viele Portionen die Zutaten sind (Standard: 4)
#    kategorie:   nudeln | reis | kartoffeln | gebackenes | sonstiges
#                 (optional – wird sonst aus dem Titel erraten)
#    ernaehrung:  vegan | vegetarisch | fisch | fleisch
#                 (optional – wird sonst aus den Zutaten erraten)
#    tags:        [schnell, ...]       (optional, nur zur Anzeige)
#    nur_an:      [fr, sa, so]         (optional – nur an diesen Tagen einplanen)
#    link:        https://...          (optional – Originalrezept)
#    notiz:       freier Text          (optional – z. B. Zubereitung)
#    bild:        pizza                (optional – Illustration erzwingen)
#    id:          kurzer-name          (optional – nur nötig, wenn ihr ein Rezept
#                                       umbenennt und die Votes behalten wollt)
#    zutaten:     Liste, je Zeile "Menge Einheit Zutat", z. B.
#                   - 375 g Kartoffeln
#                   - 1 EL Öl
#                   - 2 Zwiebeln
#                   - Salz
#                 Einheiten: g, kg, ml, l, EL, TL, Prise, Bund, Dose, Pck., Zehe,
#                 Becher, Glas, Scheibe, Tasse, Stange, Kopf, Würfel …
# ─────────────────────────────────────────────────────────────────────

rezepte:
  - titel: Kartoffelsuppe
    kategorie: kartoffeln
    ernaehrung: vegan
    tags: [schnell]
    zutaten:
      - 750 g Kartoffeln
      - 2 Karotten
      - 1 Zwiebel
      - 1 Stange Lauch
      - 1 l Gemüsebrühe
      - 1 EL Öl
      - Salz
      - Pfeffer

  - titel: Kürbissuppe
    ernaehrung: vegetarisch
    tags: [schnell]
    zutaten:
      - 1 kg Hokkaido-Kürbis
      - 2 Karotten
      - 1 Zwiebel
      - 1 Zehe Knoblauch
      - 750 ml Gemüsebrühe
      - 200 ml Sahne
      - 1 TL Currypulver

  - titel: Spaghetti Bolognese
    kategorie: nudeln
    ernaehrung: fleisch
    zutaten:
      - 500 g Spaghetti
      - 400 g Hackfleisch
      - 1 Dose Tomaten
      - 2 EL Tomatenmark
      - 1 Zwiebel
      - 2 Karotten
      - 1 Zehe Knoblauch
      - 50 g Parmesan

  - titel: Käsespätzle
    kategorie: nudeln
    ernaehrung: vegetarisch
    zutaten:
      - 500 g Spätzle
      - 200 g Bergkäse
      - 3 Zwiebeln
      - 2 EL Butter

  - titel: Zucchini-Pasta
    kategorie: nudeln
    ernaehrung: vegetarisch
    tags: [schnell]
    zutaten:
      - 500 g Penne
      - 2 Zucchini
      - 200 ml Sahne
      - 100 g Parmesan
      - 1 Zehe Knoblauch

  - titel: Pasta mit Pilzrahmsoße
    kategorie: nudeln
    ernaehrung: vegetarisch
    zutaten:
      - 500 g Tagliatelle
      - 400 g Champignons
      - 200 ml Sahne
      - 1 Zwiebel
      - ½ Bund Petersilie

  - titel: Gemüse-Reispfanne
    kategorie: reis
    ernaehrung: vegan
    tags: [schnell]
    zutaten:
      - 250 g Reis
      - 1 Paprika
      - 2 Karotten
      - 1 Zucchini
      - 3 EL Sojasoße
      - 1 Zwiebel

  - titel: Paneer Butter Masala
    kategorie: reis
    ernaehrung: vegetarisch
    zutaten:
      - 250 g Reis
      - 400 g Paneer
      - 1 Dose Tomaten
      - 200 ml Sahne
      - 1 Zwiebel
      - 2 Zehen Knoblauch
      - 2 EL Garam Masala
      - 2 EL Butter

  - titel: Hähnchen-Curry mit Reis
    kategorie: reis
    ernaehrung: fleisch
    zutaten:
      - 250 g Reis
      - 500 g Hähnchenbrust
      - 400 ml Kokosmilch
      - 1 Paprika
      - 1 Zwiebel
      - 2 EL Currypaste

  - titel: Kartoffelpuffer mit Apfelmus
    kategorie: kartoffeln
    ernaehrung: vegetarisch
    zutaten:
      - 1 kg Kartoffeln
      - 1 Zwiebel
      - 2 Eier
      - 3 EL Mehl
      - 1 Glas Apfelmus

  - titel: Ofenkartoffeln mit Kräuterquark
    kategorie: kartoffeln
    ernaehrung: vegetarisch
    zutaten:
      - 1,2 kg Kartoffeln
      - 500 g Quark
      - 1 Bund Schnittlauch
      - 2 EL Öl

  - titel: Pizza Margherita
    kategorie: gebackenes
    ernaehrung: vegetarisch
    nur_an: [fr, sa, so]
    zutaten:
      - 500 g Mehl
      - 1 Würfel Hefe
      - 1 Dose Tomaten
      - 250 g Mozzarella
      - 1 Bund Basilikum

  - titel: Flammkuchen
    kategorie: gebackenes
    ernaehrung: fleisch
    nur_an: [fr, sa, so]
    zutaten:
      - 1 Pck. Flammkuchenteig
      - 200 g Schmand
      - 150 g Speck
      - 2 Zwiebeln

  - titel: Gemüselasagne
    kategorie: gebackenes
    ernaehrung: vegetarisch
    zutaten:
      - 250 g Lasagneplatten
      - 2 Zucchini
      - 1 Paprika
      - 1 Dose Tomaten
      - 200 g Mozzarella
      - 500 ml Milch
      - 2 EL Mehl
      - 2 EL Butter

  - titel: Linsen-Dal
    ernaehrung: vegan
    zutaten:
      - 250 g rote Linsen
      - 400 ml Kokosmilch
      - 1 Dose Tomaten
      - 1 Zwiebel
      - 2 Zehen Knoblauch
      - 1 TL Kurkuma

  - titel: Wraps mit Bohnen und Mais
    ernaehrung: vegetarisch
    tags: [schnell]
    zutaten:
      - 8 Tortilla-Wraps
      - 1 Dose Kidneybohnen
      - 1 Dose Mais
      - 1 Paprika
      - 200 g Reibekäse
      - 200 g Schmand

  - titel: Lachs mit Brokkoli
    ernaehrung: fisch
    tags: [schnell]
    zutaten:
      - 4 Lachsfilets
      - 1 Kopf Brokkoli
      - 1 Zitrone
      - 2 EL Butter

  - titel: Pfannkuchen
    ernaehrung: vegetarisch
    tags: [schnell]
    zutaten:
      - 250 g Mehl
      - 3 Eier
      - 500 ml Milch
      - 1 Glas Apfelmus
