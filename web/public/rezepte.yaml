# ─────────────────────────────────────────────────────────────────────
#  weekleat – Rezeptkatalog
#
#  Hier stehen eure Lieblingsrezepte. Nach dem Speichern und Pushen ist die
#  Datei nach ca. 1 Minute in der App (einfach neu öffnen).
#
#  Felder pro Rezept:
#    titel:       Pflicht
#    portionen:   für wie viele Portionen die Zutaten sind (Standard: 4)
#    kategorie:   nudeln | reis | kartoffeln | gebackenes | sonstiges
#                 (optional – wird sonst aus dem Titel erraten)
#    ernaehrung:  vegan | vegetarisch | fisch | fleisch
#                 (optional – wird sonst aus den Zutaten erraten)
#    tags:        [schnell, ...]       (optional, nur zur Anzeige)
#    nur_an:      [fr, sa, so]         (optional – nur an diesen Tagen einplanen)
#    quelle:      HelloFresh           (optional – wo das Rezept steht, z. B.
#                                       HelloFresh, Marley Spoon, Omas Kochbuch S. 42)
#    link:        https://...          (optional – Originalrezept; ohne "quelle"
#                                       wird die Website als Quelle angezeigt)
#    notiz:       freier Text          (optional – z. B. Zubereitung)
#    bild:        pizza                (optional – Illustration erzwingen)
#    id:          kurzer-name          (optional – nur nötig, wenn ihr ein Rezept
#                                       umbenennt und die Votes behalten wollt)
#    zutaten:     Liste, je Zeile "Menge Einheit Zutat", z. B.
#                   - 375 g Kartoffeln
#                   - 1 EL Öl
#                   - 2 Zwiebeln
#                   - Salz
#                 Einheiten: g, kg, ml, l, EL, TL, Prise, Bund, Dose, Pck., Zehe,
#                 Becher, Glas, Scheibe, Tasse, Stange, Kopf, Würfel …
# ─────────────────────────────────────────────────────────────────────

rezepte:
  - titel: Gnocchi mit Ofenkürbis und Kräuter-Frischecreme
    quelle: HelloFresh
    kategorie: nudeln
    ernaehrung: vegetarisch
    bild: pumpkin
    tags: [Family]
    zutaten:
      - 800 g frische Gnocchi
      - 1 Hokkaido-Kürbis
      - 200 g Frischecreme
      - 10 g Petersilie & Salbei
      - 40 g Hartkäse (ital. Art, gerieben)
      - 40 g Kürbiskerne
      - 1 Zitrone
      - 10 ml Kürbiskernöl
      - 1 Zehe Knoblauch
      - 20 g Honig

  - titel: Grünes Gemüsecurry mit Brokkoli, Erdnüssen und Limettenreis
    quelle: HelloFresh
    kategorie: reis
    ernaehrung: vegan
    tags: [viel Gemüse]
    zutaten:
      - 300 g Jasminreis
      - 2 Paprika
      - 300 g braune Champignons
      - 1 Brokkoli
      - 2 Schalotten
      - 2 Limetten
      - 10 g Koriander & Petersilie
      - 500 ml Kokosmilch
      - 50 g grüne Currypaste
      - 40 g gesalzene Erdnüsse
      - 8 g Gemüsebrühpulver

  - titel: Ingwer-Sesam-Hähnchen mit knackigem Gemüse und Jasminreis
    quelle: HelloFresh
    kategorie: reis
    ernaehrung: fleisch
    zutaten:
      - 300 g Jasminreis
      - 500 g Hähnchengeschnetzeltes
      - 1 Brokkoli
      - 2 Karotten
      - 2 Frühlingszwiebeln
      - 2 Zehen Knoblauch
      - 40 g Ingwer
      - 100 ml Sojasoße
      - 20 ml Sesamöl
      - 20 g Sesam
      - 8 g Maisstärke

  - titel: Indische Kichererbsen-Kokos-Suppe mit Babyspinat
    quelle: HelloFresh
    ernaehrung: vegetarisch
    bild: soup
    zutaten:
      - 760 g Kichererbsen (2 Dosen)
      - 4 Karotten
      - 2 Ofenkartoffeln
      - 2 Zwiebeln
      - 500 ml Kokosmilch
      - 50 g gelbe Currypaste
      - 60 g gehackter Knoblauch & Ingwer in Öl
      - 4 g Madras-Curry-Pulver
      - 16 g Gemüsebrühpulver
      - 100 g Babyspinat
      - 1 Limette
      - 200 g saure Sahne
    notiz: |
      Statt „Hello Piri-Piri“ (4 g): Chiliflocken, Paprikapulver und etwas Knoblauch
      für die gerösteten Kichererbsen.

  - titel: Griechische Hähnchen-Zitronen-Suppe mit Orzo
    quelle: HelloFresh
    kategorie: nudeln
    ernaehrung: fleisch
    bild: lemon
    tags: [High Protein]
    zutaten:
      - 500 g Hähncheninnenbrustfilet
      - 180 g Orzo-Nudeln
      - 2 Karotten
      - 2 Zwiebeln
      - 2 Zehen Knoblauch
      - 12 g Hühnerbrühe
      - 10 g Oregano & Petersilie
      - 2 Zitronen
      - 100 g Babyspinat
      - 200 g Crème fraîche
    notiz: |
      Statt Gewürzmischung „Hello Paprika“ (8 g): edelsüßes Paprikapulver,
      etwas Knoblauchpulver und eine Prise Chili.

  - titel: Herzhafte Hackbällchen mit Orangen-Couscous und Paprikasugo
    quelle: Marley Spoon
    portionen: 2
    ernaehrung: fleisch
    zutaten:
      - 250 g Schweinehackfleisch
      - 150 g Vollkorn-Couscous
      - 1 Orange (unbehandelt)
      - 1 rote Paprika
      - 1 Zwiebel
      - 1 Zehe Knoblauch
      - 1 Dose gehackte Tomaten
      - 20 g Petersilie & Minze
      - 1 Pck. Gemüsebrühe
    notiz: |
      Tajine-Gewürzmischung selbst mischen: Kurkuma, Koriander, Ingwer,
      Kreuzkümmel, Pfeffer, Zimt, Paprika, Muskat, Nelke, Kardamom.

  - titel: Spicy Tofu Buddha Bowl mit Erdnusssoße und Karottensalat
    quelle: HelloFresh
    kategorie: reis
    ernaehrung: vegan
    bild: brokkoli
    zutaten:
      - 360 g Tofu (süßer Chili-Grill-Tofu)
      - 300 g Jasminreis
      - 1 Brokkoli
      - 2 Karotten
      - 1 Limette
      - 4 Zehen Knoblauch
      - 100 g Erdnussbutter
      - 360 ml Kokosmilch
      - 10 g Koriander & Petersilie
      - 50 ml Sojasoße
      - 50 g Sweet-Chili-Soße

  - titel: Stir Fry – Pfannengemüse mit Erdnuss-Chili-Soße
    quelle: HelloFresh
    kategorie: reis
    ernaehrung: vegan
    bild: paprika
    tags: [viel Gemüse]
    zutaten:
      - 300 g Basmatireis
      - 2 Paprika
      - 4 Karotten
      - 300 g braune Champignons
      - 200 g Buschbohnen
      - 2 rote Chilischoten
      - 2 Frühlingszwiebeln
      - 1 Limette
      - 60 g gehackter Knoblauch & Ingwer in Öl
      - 360 ml Kokosmilch
      - 50 g Erdnussbutter
      - 40 g gesalzene Erdnüsse
      - 50 ml Sojasoße
