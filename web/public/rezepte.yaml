# ─────────────────────────────────────────────────────────────────────
#  weekleat – Rezeptkatalog
#
#  Hier stehen eure Lieblingsrezepte. Nach dem Speichern und Pushen ist die
#  Datei nach ca. 1 Minute in der App (einfach neu öffnen).
#
#  Felder pro Rezept:
#    titel:       Pflicht
#    portionen:   für wie viele Portionen die Zutaten sind (Standard: 4)
#    kategorie:   nudeln | reis | kartoffeln | gebackenes | sonstiges
#                 (optional – wird sonst aus dem Titel erraten)
#    ernaehrung:  vegan | vegetarisch | fisch | fleisch
#                 (optional – wird sonst aus den Zutaten erraten)
#    tags:        [schnell, ...]       (optional, nur zur Anzeige)
#    nur_an:      [fr, sa, so]         (optional – nur an diesen Tagen einplanen)
#    planen:      nein                 (optional – nie automatisch einplanen, z. B.
#                                       Beilagen und Soßen; von Hand wählbar)
#    quelle:      HelloFresh           (optional – wo das Rezept steht, z. B.
#                                       HelloFresh, Marley Spoon, Omas Kochbuch S. 42)
#    link:        https://...          (optional – Originalrezept; ohne "quelle"
#                                       wird die Website als Quelle angezeigt)
#    notiz:       freier Text          (optional – z. B. Zubereitung)
#    bild:        pizza                (optional – Illustration erzwingen)
#    id:          kurzer-name          (optional – nur nötig, wenn ihr ein Rezept
#                                       umbenennt und die Votes behalten wollt)
#    zutaten:     Liste, je Zeile "Menge Einheit Zutat", z. B.
#                   - 375 g Kartoffeln
#                   - 1 EL Öl
#                   - 2 Zwiebeln
#                   - Salz
#                 Einheiten: g, kg, ml, l, EL, TL, Prise, Bund, Dose, Pck., Zehe,
#                 Becher, Glas, Scheibe, Tasse, Stange, Kopf, Würfel …
# ─────────────────────────────────────────────────────────────────────

